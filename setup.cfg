[flake8]
max-line-length = 79
ignore =
    W503,
    D100,
    D101,
    D102,
    D104,
    D105,
    D106,
    D107,
    D205,
    D400,
    D401
exclude =
    tests/,
    */migrations/,
    data/,
    venv/,
    env/,
    */venv/,
    docs/,
    frontend/,
    infra/
per-file-ignores =
    */settings.py:E501

[isort]
line_length = 79
skip = venv,migrations
known_first_party = api,recipes,users,foodgram
multi_line_output = 3
include_trailing_comma = true
