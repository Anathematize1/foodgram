name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-secret-key-not-for-production
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt flake8
      - name: Lint
        run: flake8 backend --exclude=backend/venv,backend/**/migrations
      - name: Tests
        run: python manage.py test api.tests
        working-directory: backend

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t foodgram-backend ./backend
      - name: Check compose file
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml config
